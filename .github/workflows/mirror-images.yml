name: Mirror Dify images to ghcr.io

on:
  workflow_dispatch: {}

jobs:
  mirror:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - src: busybox:latest
            name: busybox
            tag: latest
          - src: redis:6-alpine
            name: redis
            tag: 6-alpine
          - src: postgres:15-alpine
            name: postgres
            tag: 15-alpine
          - src: nginx:latest
            name: nginx
            tag: latest
          - src: langgenius/dify-api:1.14.2
            name: dify-api
            tag: "1.14.2"
          - src: langgenius/dify-web:1.14.2
            name: dify-web
            tag: "1.14.2"
    steps:
      - name: Log in to ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Pull linux/arm64 from Docker Hub
        run: docker pull --platform linux/arm64 ${{ matrix.src }}

      - name: Retag for ghcr.io
        run: docker tag ${{ matrix.src }} ghcr.io/${{ github.repository_owner }}/dify-image-mirror/${{ matrix.name }}:${{ matrix.tag }}

      - name: Push to ghcr.io
        run: docker push ghcr.io/${{ github.repository_owner }}/dify-image-mirror/${{ matrix.name }}:${{ matrix.tag }}
